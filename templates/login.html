{% extends "base.html" %}


{% block title %}

Login - SmartCard

{% endblock %}


{% block content %}


<div class="form-container">

    <h2>
        Welcome Back
    </h2>


    <p class="form-subtitle">

        Login to manage your SmartCard.

    </p>


    <form
        method="POST"
        action="{{ url_for('login') }}"
    >


        <label>
            Email
        </label>


        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >


        <label>
            Password
        </label>


        <div class="password-box">

            <input
                type="password"
                id="login-password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button
                type="button"
                class="toggle-password"
                data-target="login-password"
            >
                Show
            </button>

        </div>


        <button
            type="submit"
            class="button full-width"
        >

            Login

        </button>


    </form>


    <p class="form-footer">

        Don't have an account?

        <a href="{{ url_for('register') }}">
            Create Account
        </a>

    </p>


</div>


{% endblock %}
